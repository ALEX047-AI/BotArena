[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botarena"
version = "0.1.0"
description = "Локальная платформа для сравнения алгоритмов автономных ботов"
requires-python = ">=3.11"
authors = [
  { name = "Команда BotArena" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
botarena = "botarena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
